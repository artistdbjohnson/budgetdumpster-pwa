<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order received | Budget Dumpster</title>
  <meta name="description" content="This was a mock checkout for an independent design study. No payment was processed and no dumpster will be delivered." />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('bd-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (localStorage.getItem('bd-lang') === 'pt') document.documentElement.setAttribute('lang', 'pt');
      } catch (e) {}
    })();
  </script>
</head>
<body class="page">
  <section class="success">
    <div class="brand-mark">BD</div>
    <h1>Payment submitted</h1>
    <p class="lead" style="margin:0 auto" data-i18n="study.success">This was a mock checkout for an independent design study. No payment was processed and no dumpster will be delivered.</p>
    <p style="margin-top:24px"><a class="cta" href="/" data-i18n="success.back">Back home</a></p>
  </section>
  <script src="/js/app.js"></script>
</body>
</html>
